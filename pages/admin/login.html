<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to KampoStay admin dashboard to manage the platform.">
  <meta name="kampostay-api-base" content="https://kampostayback.onrender.com/api/v1">
  <title>Admin Log In — KampoStay</title>
  <link rel="icon" href="../../icons/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <a href="../../index.html" class="auth-visual__brand" style="color:inherit;text-decoration:none;">Kampo<span>Stay</span></a>
      <p>Platform administration and management.</p>
    </div>
    <div class="auth-form-panel">
      <form id="login-form" class="auth-form">
        <h1 class="auth-form__title">Admin Log In</h1>
        <p class="auth-form__subtitle">Manage users, properties, and platform settings.</p>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" required autocomplete="email" placeholder="admin@kampostay.co.ke">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="form-input-wrapper">
            <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
            <button type="button" class="form-input__toggle" data-toggle="password" aria-label="Toggle password visibility">
              <svg class="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="flex justify-between mb-4">
          <label class="form-checkbox"><input type="checkbox" name="remember"> Remember me</label>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">Log In as Admin</button>
        <p class="text-center mt-8 text-muted">Authorized personnel only.</p>
        <p class="text-center mt-4 text-sm text-muted">Student? <a href="../auth/login.html">Log in here</a></p>
        <p class="text-center mt-4 text-sm text-muted">Landlord? <a href="../landlord/login.html">Log in here</a></p>
        <p class="text-center mt-4"><a href="../../index.html" class="text-sm">← Back to home</a></p>
      </form>
    </div>
  </div>
  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="../../js/pages/admin-auth.js"></script>
</body>
</html>
