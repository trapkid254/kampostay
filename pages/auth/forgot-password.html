<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="kampostay-api-base" content="https://kampostayback.onrender.com/api/v1">
  <title>Forgot Password — KampoStay</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <a href="../../index.html" class="auth-visual__brand" style="color:inherit;text-decoration:none;">Kampo<span>Stay</span></a>
      <p>We'll send you a link to reset your password.</p>
    </div>
    <div class="auth-form-panel">
      <form id="forgot-form" class="auth-form">
        <h1 class="auth-form__title">Reset Password</h1>
        <p class="auth-form__subtitle">Enter the email associated with your account.</p>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">Send Reset Link</button>
        <p class="text-center mt-8 text-muted"><a href="login.html">Back to login</a></p>
      </form>
    </div>
  </div>
  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="../../js/pages/auth.js"></script>
</body>
</html>
