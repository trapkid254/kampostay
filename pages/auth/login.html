<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your KampoStay account to manage bookings, favourites, and more.">
  <meta name="kampostay-api-base" content="https://kampostayback.onrender.com/api/v1">
  <title>Log In — KampoStay</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <a href="../../index.html" class="auth-visual__brand" style="color:inherit;text-decoration:none;">Kampo<span>Stay</span></a>
      <p>Welcome back. Your next home near campus is waiting.</p>
    </div>
    <div class="auth-form-panel">
      <form id="login-form" class="auth-form">
        <h1 class="auth-form__title">Log In</h1>
        <p class="auth-form__subtitle">Access your bookings, favourites, and saved searches.</p>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
        </div>
        <div class="flex justify-between mb-4">
          <label class="form-checkbox"><input type="checkbox" name="remember"> Remember me</label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">Log In</button>
        <p class="text-center mt-8 text-muted">Don't have an account? <a href="register.html">Sign up</a></p>
        <p class="text-center mt-4"><a href="../../index.html" class="text-sm">← Back to home</a></p>
      </form>
    </div>
  </div>
  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="../../js/pages/auth.js"></script>
</body>
</html>
