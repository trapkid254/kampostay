<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="kampostay-api-base" content="https://kampostayback.onrender.com/api/v1">
  <title>Verify Email — KampoStay</title>
  <link rel="icon" href="../../icons/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-visual">
      <a href="../../index.html" class="auth-visual__brand" style="color:inherit;text-decoration:none;">Kampo<span>Stay</span></a>
      <p>Almost there — verify your email to unlock all features.</p>
    </div>
    <div class="auth-form-panel">
      <form id="verify-form" class="auth-form">
        <h1 class="auth-form__title">Verify Your Email</h1>
        <p class="auth-form__subtitle">Enter the verification code from your email.</p>
        <div class="form-group">
          <label class="form-label" for="token">Verification Code</label>
          <input type="text" id="token" name="token" class="form-input" required placeholder="Enter 6-digit code" autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">Verify Email</button>
        <p class="text-center mt-8 text-muted"><a href="login.html">Back to login</a></p>
      </form>
    </div>
  </div>
  <script type="module" src="../../js/app.js"></script>
  <script type="module" src="../../js/pages/auth.js"></script>
</body>
</html>
