<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="kampostay-api-base" content="https://kampostayback.onrender.com/api/v1">
  <title>List Your Property — KampoStay</title>
  <link rel="icon" href="../../../icons/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../css/variables.css">
  <link rel="stylesheet" href="../../../css/base.css">
  <link rel="stylesheet" href="../../../css/layout.css">
  <link rel="stylesheet" href="../../../css/components.css">
  <link rel="stylesheet" href="../../../css/pages.css">
</head>
<body>
  <div class="container" style="max-width: var(--container-narrow); padding: var(--space-12) var(--space-6);">
    <div class="section__header">
      <a href="../student.html" class="btn btn--ghost btn--sm">← Back to Dashboard</a>
      <h1>List Your Property</h1>
      <p>Reach thousands of students looking for accommodation.</p>
    </div>

    <form id="property-form" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="title">Property Title</label>
        <input type="text" id="title" name="title" class="form-input" required placeholder="e.g., Green View Hostels">
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description</label>
        <textarea id="description" name="description" class="form-textarea" rows="4" required placeholder="Describe your property..."></textarea>
      </div>

      <div class="grid grid--2" style="gap: var(--space-4);">
        <div class="form-group">
          <label class="form-label" for="university">University</label>
          <select id="university" name="university" class="form-select" required>
            <option value="">Select university</option>
            <option value="jkuat">JKUAT</option>
            <option value="uon">University of Nairobi</option>
            <option value="kenyatta">Kenyatta University</option>
            <option value="strathmore">Strathmore University</option>
            <option value="mku">Mount Kenya University</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="city">City/Town</label>
          <input type="text" id="city" name="city" class="form-input" required placeholder="e.g., Juja">
        </div>
      </div>

      <div class="grid grid--2" style="gap: var(--space-4);">
        <div class="form-group">
          <label class="form-label" for="rent">Monthly Rent (KSh)</label>
          <input type="number" id="rent" name="rent" class="form-input" required placeholder="e.g., 6500">
        </div>
        <div class="form-group">
          <label class="form-label" for="roomCount">Number of Rooms</label>
          <input type="number" id="roomCount" name="roomCount" class="form-input" required placeholder="e.g., 12">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Amenities</label>
        <div class="grid grid--2" style="gap: var(--space-3);">
          <label class="form-checkbox"><input type="checkbox" name="amenities" value="wifi"> Wi-Fi</label>
          <label class="form-checkbox"><input type="checkbox" name="amenities" value="water"> Water</label>
          <label class="form-checkbox"><input type="checkbox" name="amenities" value="electricity"> Electricity</label>
          <label class="form-checkbox"><input type="checkbox" name="amenities" value="security"> Security</label>
          <label class="form-checkbox"><input type="checkbox" name="amenities" value="parking"> Parking</label>
          <label class="form-checkbox"><input type="checkbox" name="amenities" value="furnished"> Furnished</label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="images">Upload Images</label>
        <input type="file" id="images" name="images" class="form-input" multiple accept="image/*">
      </div>

      <button type="submit" class="btn btn--primary btn--lg" style="width: 100%;">Submit Property</button>
    </form>
  </div>

  <script type="module" src="../../../js/app.js"></script>
  <script type="module" src="../../../js/pages/property-form.js"></script>
</body>
</html>
